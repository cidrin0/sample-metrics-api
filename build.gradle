plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.0'
	id 'io.spring.dependency-management' version '1.1.7'
	
	// Code Quality & Coverage
	id 'checkstyle'
	id 'com.github.spotbugs' version '6.0.0'
	id 'jacoco'
}

group = 'br.com.grafana.sma'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot and Prometheus Integration'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
	implementation 'org.flywaydb:flyway-core'

	runtimeOnly 'io.micrometer:micrometer-registry-otlp'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// Integration testing
	testImplementation 'org.testcontainers:testcontainers:1.20.1'
	testImplementation 'org.testcontainers:postgresql:1.20.1'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Checkstyle Configuration
checkstyle {
	configFile = file("${rootDir}/checkstyle.xml")
	toolVersion = '10.17.0'
	ignoreFailures = true
}

// SpotBugs Configuration
spotbugs {
	effort = 'max'
	reportLevel = 'medium'
	ignoreFailures = false
	excludeFilter = file("${rootDir}/spotbugs-exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask) {
	reports {
		html { enabled = true }
	}
}

// JaCoCo Configuration
jacoco {
	toolVersion = "0.8.11"
}

jacocoTestReport {
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	dependsOn test
}

// Integration Test Source Set and Task
sourceSets {
	integrationTest {
		java {
			srcDir file('src/integration-test/java')
		}
		resources {
			srcDir file('src/integration-test/resources')
		}
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

task integrationTest(type: Test) {
	useJUnitPlatform()
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath + sourceSets.main.output
	shouldRunAfter test
}

// Include integration tests in build checks
check.dependsOn integrationTest
check.dependsOn checkstyleMain
check.dependsOn spotbugsMain
check.dependsOn jacocoTestReport
