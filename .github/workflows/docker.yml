name: Docker Build & Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build application JAR
        run: ./gradlew build -x test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract version from tag
        id: extract_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/sample-metrics-api:${{ github.sha }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/sample-metrics-api:${{ steps.extract_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JAR_FILE=build/libs/sample-metrics-api-0.0.1-SNAPSHOT.jar

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ secrets.DOCKER_HUB_USERNAME }}/sample-metrics-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.json
          upload-artifact: true

      - name: Create GitHub release
        if: steps.extract_version.outputs.is_release == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.extract_version.outputs.version }}
          release_name: Release ${{ steps.extract_version.outputs.version }}
          body: |
            ## Docker Image
            ```
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/sample-metrics-api:${{ steps.extract_version.outputs.version }}
            ```
            
            ## Changes
            See [commit history](https://github.com/${{ github.repository }}/commits/${{ github.sha }})
            
            ## Build Details
            - Docker Image: `${{ secrets.DOCKER_HUB_USERNAME }}/sample-metrics-api:${{ steps.extract_version.outputs.version }}`
            - SHA: `${{ github.sha }}`
            - Build: [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          draft: false
          prerelease: false

      - name: Upload SBOM to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 60

      - name: Print image info
        run: |
          echo "✅ Docker image built and pushed successfully!"
          echo "📦 Image: ${{ secrets.DOCKER_HUB_USERNAME }}/sample-metrics-api:${{ github.sha }}"
          echo "🏷️  Tags:"
          echo "  - ${{ github.sha }}"
          echo "  - ${{ steps.extract_version.outputs.version }}"
