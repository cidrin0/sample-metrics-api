name: Infra & Security PR Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  label-infra:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Label PRs touching infra files
        uses: actions/github-script@v6
        with:
          script: |
            const changedFiles = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            const paths = changedFiles.data.map(f => f.filename);
            const infraRegex = /(^docker-compose.yml$|^config\/|^\.github\/workflows\/|^infra\/|^scripts\/deploy\/|^cloudformation\/|^terraform\/)/;
            if (paths.some(p => infraRegex.test(p))) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['requires-human-review']
              });
            }
