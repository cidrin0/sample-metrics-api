name: Security and Lint Analysis

on:
  pull_request:
  push:
    branches:
      - main
      - "agents/**"

jobs:
  lint-and-fortify:
    name: LintCode and Fortify Verify
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Run LintCode
        run: |
          echo "Checking for lintcode in PATH..."
          if ! command -v lintcode >/dev/null 2>&1; then
            echo "ERROR: 'lintcode' CLI not found in PATH. Add installation steps or a runner image with lintcode available."
            exit 1
          fi
          echo "Running lintcode..."
          lintcode

      - name: Run Fortify issue verify
        run: |
          echo "Checking for Fortify CLI in PATH..."
          if ! command -v fortify >/dev/null 2>&1; then
            echo "ERROR: 'fortify' CLI not found in PATH. Add installation steps or configure Fortify SCA on the runner."
            exit 1
          fi
          echo "Running 'fortify issue verify'..."
          fortify issue verify